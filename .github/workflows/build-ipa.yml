name: Build unsigned IPA

# カーブフリック実装用。未署名の .ipa を artifact として取り出し、
# Windows 側の Sideloadly で署名して実機へ入れるための経路。
# 本家のワークフローには手を入れず、このファイルだけを追加している。

on:
  workflow_dispatch:
  push:
    branches:
      - curve-flick

jobs:
  build-ipa:
    name: Archive and package unsigned .ipa
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Cache DerivedData
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-derived-data-${{ hashFiles('**/project.pbxproj', '**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-derived-data-

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project azooKey.xcodeproj \
            -scheme MainApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/azooKey.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Inspect app bundle
        run: |
          APP=$(ls -d "$RUNNER_TEMP/azooKey.xcarchive/Products/Applications/"*.app | head -1)
          echo "APP=$APP"
          echo "--- top level ---"
          ls -la "$APP"
          echo "--- PlugIns (keyboard extension is expected here) ---"
          if [ -d "$APP/PlugIns" ]; then
            ls -la "$APP/PlugIns"
          else
            echo "NO PlugIns DIRECTORY - keyboard extension was NOT embedded"
          fi

      - name: Package unsigned .ipa
        run: |
          APP=$(ls -d "$RUNNER_TEMP/azooKey.xcarchive/Products/Applications/"*.app | head -1)
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry azooKey-unsigned.ipa Payload
          ls -lh azooKey-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: azooKey-unsigned-ipa
          path: ${{ runner.temp }}/azooKey-unsigned.ipa
          retention-days: 7
